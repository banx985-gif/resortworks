<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1FA3A0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RESORTWORKS" />
    <title>RESORTWORKS</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/branding/pwa/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/branding/pwa/apple-touch-icon-180.png" />
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body>
    <canvas id="game" aria-label="RESORTWORKS"></canvas>
    <script type="module" src="src/main.js"></script>
    <script>
      // Installable web app: only when served over http(s), so opening the
      // file straight from the PC keeps working.
      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch((e) => console.warn('service worker not registered', e));
        });
      }
    </script>
  </body>
</html>
